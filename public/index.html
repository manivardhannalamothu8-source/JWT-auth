
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Authentication & JWT</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2ff;
            color: #1f2937;
        }
        .container {
            max-width: 430px;
            margin: 45px auto;
            padding: 25px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 8px 25px #0001;
        }
        h1 { text-align: center; font-size: 24px; }
        h2 { font-size: 19px; }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 7px 0;
            border-radius: 7px;
            font-size: 15px;
        }
        input { border: 1px solid #cbd5e1; }
        button {
            border: none;
            background: #4f46e5;
            color: white;
            cursor: pointer;
        }
        button:hover { background: #3730a3; }
        .secondary { background: #475569; }
        #message { overflow-wrap: anywhere; }
        .section {
            margin-top: 22px;
            padding-top: 12px;
            border-top: 1px solid #e5e7eb;
        }
        .hidden { display: none; }
        .status { font-size: 14px; }
    </style>
</head>
<body>
    <main class="container">
        <h1>User Authentication & JWT</h1>
        <p class="status">Register, log in, and test protected API routes.</p>

        <section>
            <h2>Create Account</h2>
            <form id="registerForm">
                <input id="regName" placeholder="Full name"
                       maxlength="100" required>
                <input id="regEmail" type="email"
                       placeholder="Email address" required>
                <input id="regPassword" type="password"
                       placeholder="Password (minimum 8 characters)"
                       minlength="8" maxlength="72" required>
                <button type="submit">Register</button>
            </form>
        </section>

        <section class="section">
            <h2>Login</h2>
            <form id="loginForm">
                <input id="loginEmail" type="email"
                       placeholder="Email address" required>
                <input id="loginPassword" type="password"
                       placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
        </section>

        <section class="section">
            <h2>Protected Area</h2>
            <button id="profileBtn">View My Profile</button>
            <button id="protectedBtn">Test Protected Route</button>
            <button id="logoutBtn" class="secondary">Logout</button>
            <pre id="result">Log in to test protected routes.</pre>
        </section>

        <p id="message" role="status" aria-live="polite"></p>
    </main>

    <script>
        let authToken = null;

        const message = document.getElementById("message");
        const result = document.getElementById("result");

        async function api(url, options = {}) {
            const headers = {
                ...(options.body ? {
                    "Content-Type": "application/json"
                } : {}),
                ...(authToken ? {
                    "Authorization": "Bearer " + authToken
                } : {}),
                ...options.headers
            };

            const response = await fetch(url, {
                ...options,
                headers
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.message || "Request failed.");
            }

            return data;
        }

        document.getElementById("registerForm")
            .addEventListener("submit", async event => {
                event.preventDefault();
                message.textContent = "";

                try {
                    const data = await api("/api/auth/register", {
                        method: "POST",
                        body: JSON.stringify({
                            name: document.getElementById("regName").value,
                            email: document.getElementById("regEmail").value,
                            password: document.getElementById("regPassword").value
                        })
                    });

                    message.textContent = data.message;
                    document.getElementById("registerForm").reset();
                } catch (error) {
                    message.textContent = error.message;
                }
            });

        document.getElementById("loginForm")
            .addEventListener("submit", async event => {
                event.preventDefault();
                message.textContent = "";

                try {
                    const data = await api("/api/auth/login", {
                        method: "POST",
                        body: JSON.stringify({
                            email: document.getElementById("loginEmail").value,
                            password: document.getElementById("loginPassword").value
                        })
                    });

                    authToken = data.token;
                    message.textContent = data.message;
                    result.textContent = JSON.stringify(data.user, null, 2);
                    document.getElementById("loginForm").reset();
                } catch (error) {
                    authToken = null;
                    message.textContent = error.message;
                }
            });

        document.getElementById("profileBtn")
            .addEventListener("click", async () => {
                try {
                    const data = await api("/api/auth/me");
                    result.textContent = JSON.stringify(data, null, 2);
                    message.textContent = "Profile loaded successfully.";
                } catch (error) {
                    message.textContent = error.message;
                }
            });

        document.getElementById("protectedBtn")
            .addEventListener("click", async () => {
                try {
                    const data = await api("/api/protected");
                    result.textContent = JSON.stringify(data, null, 2);
                    message.textContent = "Protected route accessed.";
                } catch (error) {
                    message.textContent = error.message;
                }
            });

        document.getElementById("logoutBtn")
            .addEventListener("click", () => {
                authToken = null;
                result.textContent = "You are logged out.";
                message.textContent = "Logout successful.";
            });
    </script>
</body>
</html>
